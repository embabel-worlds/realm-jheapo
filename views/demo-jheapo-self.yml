# DEMO ONLY: jheapo's dump of itself (data/jheapo-self-2.hprof in the jheapo checkout), served by
# `bin/jheapo-rest.sh`, read against jheapo's own jar and sources in the world's
# data/jars/jheapo-0.1.0-SNAPSHOT.jar (+ -sources.jar beside it) — the jar the producers'
# COMPILED_AS / HELD_IN keys name. Every hop into the jar is keyed: it fetches exactly that type or field.

- name: JheapoSelfRetainedInCode
  description: "Demo, jheapo's own heap: jheapo's util classes by retained bytes, with their compiled type and source."
  cypher: |
    MATCH (h:Heap {name: 'current'})-[:RETAINS]->(c:HeapClass {packageName: 'com.kodewerk.jheapo.util'})
    OPTIONAL MATCH (c)-[:COMPILED_AS]->(t:JavaType)
    OPTIONAL MATCH (t)-[:DEFINED_IN]->(s:JavaSource)
    RETURN c.className AS class, c.retainedBytes AS retainedBytes, t.hashCodeFrom AS hashCodeFrom, s.path AS source, s.lines AS lines
    ORDER BY retainedBytes DESC

- name: JheapoSelfLongMapHolders
  description: "Demo, jheapo's own heap: who holds the PrimitiveLongMaps (the top retainer), by which field as the jar declares it, and the code that assigns it."
  cypher: |
    MATCH (h:Heap {name: 'current'})-[:RETAINS]->(c:HeapClass {className: 'com.kodewerk.jheapo.util.PrimitiveLongMap'})
          -[:HAS_INSTANCE]->(o:HeapObject)-[:HELD_BY]->(hd:HeapHolder {packageName: 'com.kodewerk.jheapo.queries'})
          -[:HELD_IN]->(f:JavaField)
    OPTIONAL MATCH (f)-[:ACCESSED_BY]->(a:JavaFieldAccess {access: 'WRITE'})-[:SOURCE_AT]->(s:SourceSpan)
    RETURN f.key AS field, f.genericType AS declaredAs, count(DISTINCT o) AS maps, a.method AS assignedIn, s.text AS code
    ORDER BY maps DESC, field

- name: JheapoSelfLongMapGrowth
  description: "Demo, jheapo's own heap: where the fields holding PrimitiveLongMaps are filled - each put on them, as source writes it."
  cypher: |
    MATCH (h:Heap {name: 'current'})-[:RETAINS]->(c:HeapClass {className: 'com.kodewerk.jheapo.util.PrimitiveLongMap'})
          -[:HAS_INSTANCE]->(o:HeapObject)-[:HELD_BY]->(hd:HeapHolder {packageName: 'com.kodewerk.jheapo.queries'})
          -[:HELD_IN]->(f:JavaField)-[:ACCESSED_BY]->(a:JavaFieldAccess)-[:SAME_METHOD_CALL]->(call:JavaMethodCall {calleeName: 'put'})
          -[:AT_SITE]->(cs:JavaCallSite)
    WHERE cs.receiver = f.name OR cs.receiver = 'this.' + f.name
    RETURN DISTINCT f.key AS field, a.method AS method, cs.line AS line, cs.text AS code
    ORDER BY field, line

- name: JheapoSelfLongMapPath
  description: "Demo, jheapo's own heap: one PrimitiveLongMap's path from its GC root, each step's class with its source when jheapo's jar compiled it - where the chain enters jheapo's own code."
  cypher: |
    MATCH (h:Heap {name: 'current'})-[:RETAINS]->(c:HeapClass {className: 'com.kodewerk.jheapo.util.PrimitiveLongMap'})
          -[:HAS_INSTANCE]->(o:HeapObject)
    WITH o ORDER BY o.oid LIMIT 1
    MATCH (o)-[:PATH_TO_ROOT]->(p:HeapPathStep)
    OPTIONAL MATCH (p)-[:COMPILED_AS]->(t:JavaType)
    OPTIONAL MATCH (t)-[:DEFINED_IN]->(s:JavaSource)
    RETURN p.step AS step, p.className AS class, s.path AS source
    ORDER BY step

- name: JheapoSelfLeakPath
  description: "Demo, jheapo's own heap: the top leak suspect's path from its GC root, marking the steps jheapo's own jar compiled."
  cypher: |
    MATCH (h:Heap {name: 'current'})-[:LEAK_SUSPECT]->(o:HeapObject)
    WITH o ORDER BY o.retainedSize DESC LIMIT 1
    MATCH (o)-[:PATH_TO_ROOT]->(p:HeapPathStep)
    OPTIONAL MATCH (p)-[:COMPILED_AS]->(t:JavaType)
    RETURN o.className AS suspect, o.retainedSize AS retainedSize, p.step AS step, p.className AS class, t IS NOT NULL AS inJheapo
    ORDER BY step
