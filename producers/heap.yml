# Every producer calls jheapo's REST interface (apis/jheapo.yaml) when a query reaches it. Nothing
# is stored. jheapo serves ONE analysed dump, so the Heap anchor's name selects nothing: it is the
# handle a query starts from, `(h:Heap {name: 'current'})`, echoed onto every whole-heap row.
#
# The walks are BATCHED: jheapo's /batch routes take up to 100 keys per call and tag each row with
# `forKey`, the key it answers, so a hop over 300 objects is 3 requests, not 300. Class and package
# filters are PUSHED DOWN: `{className: …}` and `{packageName: …}` in a MATCH (or `IN [...]`) reach
# jheapo as request parameters, and rows that do not match never leave it.
#
# NO JAR IS NAMED HERE. A heap row carries its class as a binary name (`className`; `typeName` on an
# object, which also resolves jheapo's `class X` for a Class object) and, for a holder or a field
# value, the holding field as `Owner.field` (`field`, `fieldKey`, with jheapo's `static ` prefix
# removed) - exactly how realm-java-code names a JavaType (`name`) and a JavaField (`key`). A view
# reaches the application's code by pinning the jar it is given, first, and matching on those names:
#
#   OPTIONAL MATCH (j:Jar {path: CASE WHEN $jar = '' THEN null ELSE $jar END})
#   MATCH (h:Heap {name: 'current'})-[:RETAINS]->(c:HeapClass)
#   OPTIONAL MATCH (j)-[:HAS_TYPE]->(t:JavaType {name: c.className})
#
# so the same realm reads any application's dump against that application's jar.

# ── Whole heap, from the Heap anchor ────────────────────────────────────────────────────────────

- name: heapOverview
  kind: remote
  operation: getTab
  keyArgs: [heap]                  # jheapo serves one dump; an undeclared argument is not sent
  args: { tab: overview }
  echoKeyAs: heapKey
  records: "$"
  pushdown: []
  project:
    heapBytes: heapBytes
    classes: classes
    instances: instances
    classLoaders: classLoaders
    gcRootCount: gcRootCount
    duplicateStringWaste: duplicateStringWaste
    duplicateStringGroups: duplicateStringGroups
    pendingFinalization: pendingFinalization
    dumpTimestamp: dumpTimestamp

- name: heapRetainedClasses
  kind: remote
  operation: topRetained
  keyArgs: [heap]
  args: { n: 500 }
  echoKeyAs: heapKey
  records: "$[*]"
  pushdown:
    - { property: className,   op: EQUALS, argPath: className, clause: ["{value}"] }
    - { property: className,   op: IN,     argPath: className, clause: "{values}" }
    - { property: packageName, op: EQUALS, argPath: package,   clause: ["{value}"] }
    - { property: packageName, op: IN,     argPath: package,   clause: "{values}" }

- name: heapHistogramClasses
  kind: remote
  operation: getTab
  keyArgs: [heap]
  args: { tab: histogram }
  echoKeyAs: heapKey
  records: "$.rows[*]"
  pushdown: []

- name: heapLeakSuspects
  kind: remote
  operation: leakSuspects
  keyArgs: [heap]
  args: { n: 50 }
  echoKeyAs: heapKey
  records: "$[*]"
  pushdown:
    - { property: className,   op: EQUALS, argPath: className, clause: ["{value}"] }
    - { property: className,   op: IN,     argPath: className, clause: "{values}" }
    - { property: packageName, op: EQUALS, argPath: package,   clause: ["{value}"] }
    - { property: packageName, op: IN,     argPath: package,   clause: "{values}" }
  compute:
    typeName: "CASE WHEN r.className STARTS WITH 'class ' THEN split(substring(r.className, 6), ' ')[0] ELSE r.className END"

- name: heapDominators
  kind: remote
  operation: dominatorChildren
  keyArgs: [heap]
  args: { n: 100 }
  echoKeyAs: heapKey
  records: "$[*]"
  pushdown:
    - { property: className,   op: EQUALS, argPath: className, clause: ["{value}"] }
    - { property: className,   op: IN,     argPath: className, clause: "{values}" }
    - { property: packageName, op: EQUALS, argPath: package,   clause: ["{value}"] }
    - { property: packageName, op: IN,     argPath: package,   clause: "{values}" }

# ── Walks, batched by key ───────────────────────────────────────────────────────────────────────
  compute:
    typeName: "CASE WHEN r.className STARTS WITH 'class ' THEN split(substring(r.className, 6), ' ')[0] ELSE r.className END"

- name: classInstances
  kind: remote
  operation: batchInstances
  keyArg: classIds
  maxKeysPerCall: 100
  args: { n: 25 }
  records: "$[*]"
  pushdown:
    - { property: className,   op: EQUALS, argPath: className, clause: ["{value}"] }
    - { property: className,   op: IN,     argPath: className, clause: "{values}" }
    - { property: packageName, op: EQUALS, argPath: package,   clause: ["{value}"] }
    - { property: packageName, op: IN,     argPath: package,   clause: "{values}" }
  compute:
    typeName: "CASE WHEN r.className STARTS WITH 'class ' THEN split(substring(r.className, 6), ' ')[0] ELSE r.className END"

- name: objectHolders
  kind: remote
  operation: batchHolders
  keyArg: oids
  maxKeysPerCall: 100
  records: "$[*]"
  pushdown:
    - { property: className,   op: EQUALS, argPath: className, clause: ["{value}"] }
    - { property: className,   op: IN,     argPath: className, clause: "{values}" }
    - { property: packageName, op: EQUALS, argPath: package,   clause: ["{value}"] }
    - { property: packageName, op: IN,     argPath: package,   clause: "{values}" }
  compute:
    id: "r.forKey + '<' + r.oid"
    field: "CASE WHEN head([t IN r.through WHERE NOT t STARTS WITH '[']) STARTS WITH 'static ' THEN substring(head([t IN r.through WHERE NOT t STARTS WITH '[']), 7) ELSE head([t IN r.through WHERE NOT t STARTS WITH '[']) END"
    typeName: "CASE WHEN r.className STARTS WITH 'class ' THEN split(substring(r.className, 6), ' ')[0] ELSE r.className END"

- name: objectFields
  kind: remote
  operation: batchFields
  keyArg: oids
  maxKeysPerCall: 100
  records: "$[*]"
  pushdown:
    - { property: className,   op: EQUALS, argPath: className, clause: ["{value}"] }
    - { property: className,   op: IN,     argPath: className, clause: "{values}" }
    - { property: packageName, op: EQUALS, argPath: package,   clause: ["{value}"] }
    - { property: packageName, op: IN,     argPath: package,   clause: "{values}" }
    - { property: heldBy,      op: EQUALS, argPath: field,     clause: ["{value}"] }
    - { property: heldBy,      op: IN,     argPath: field,     clause: "{values}" }
  compute:
    id: "r.forKey + '.' + r.heldBy + '>' + r.oid"
    fieldKey: "CASE WHEN r.heldBy STARTS WITH 'static ' THEN substring(r.heldBy, 7) ELSE r.heldBy END"
    typeName: "CASE WHEN r.className STARTS WITH 'class ' THEN split(substring(r.className, 6), ' ')[0] ELSE r.className END"

- name: objectPaths
  kind: remote
  operation: batchPaths
  keyArg: oids
  maxKeysPerCall: 100
  records: "$[*]"
  pushdown: []
  compute:
    typeName: "CASE WHEN r.className STARTS WITH 'class ' THEN split(substring(r.className, 6), ' ')[0] ELSE r.className END"
    id: "r.forKey + '#' + toString(r.step)"
